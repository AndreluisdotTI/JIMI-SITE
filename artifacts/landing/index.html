<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JiMi food — O Hub Completo para Restaurantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#3333E5;--blue-d:#2020C0;--blue-l:#5555EE;
  --blue-xl:#EEEEFA;--blue-xxl:#F7F7FD;
  --text:#0A0A1A;--text-m:#3A3A5C;--text-mu:#6B6B8A;
  --border:#E2E2F0;--white:#FFF;--bg:#FAFAFE;
}
html{scroll-behavior:smooth;}
html{overflow-x:hidden;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--white);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:#f0f0f8;}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:72px;display:flex;align-items:center;padding:0 5%;background:rgba(255,255,255,0.94);backdrop-filter:blur(20px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s;}
.nav.scrolled{border-bottom-color:var(--border);box-shadow:0 2px 20px rgba(10,10,26,.06);}
.nav-logo img{height:62px;border-radius:7px;display:block;}
.nav-links{display:flex;gap:2rem;list-style:none;margin-left:3rem;}
.nav-links a{font-size:.875rem;font-weight:500;color:var(--text-m);text-decoration:none;transition:color .2s;}
.nav-links a:hover{color:var(--blue);}
.nav-r{margin-left:auto;display:flex;gap:.875rem;align-items:center;}
.btn-out{border:1.5px solid var(--border);background:transparent;color:var(--text-m);padding:.55rem 1.25rem;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:.875rem;cursor:pointer;transition:all .2s;}
.btn-out:hover{border-color:var(--blue);color:var(--blue);}
.btn-bl{background:var(--blue);color:#fff;border:none;padding:.6rem 1.4rem;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.875rem;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(51,51,229,.3);}
.btn-bl:hover{background:var(--blue-l);transform:translateY(-1px);box-shadow:0 6px 28px rgba(51,51,229,.4);}

/* HERO */
.hero{min-height:100vh;background:var(--blue);display:grid;grid-template-columns:1fr 46%;grid-template-areas:"head robot" "body robot";grid-template-rows:auto 1fr;padding:108px 5% 72px;column-gap:3rem;row-gap:0;position:relative;overflow:hidden;align-content:start;}
.hero-bg-mesh{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 80% at 80% 120%,rgba(255,255,255,.07) 0%,transparent 60%),radial-gradient(ellipse 50% 50% at -10% 50%,rgba(255,255,255,.05) 0%,transparent 60%);}
.hero-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:60px 60px;}
.hero-head{grid-area:head;position:relative;z-index:2;padding-bottom:1.25rem;}
.hero-body{grid-area:body;position:relative;z-index:2;align-self:start;}
.hero-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.92);padding:.35rem 1rem;border-radius:100px;font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2rem;}
.hero-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pd 2s ease-in-out infinite;}
@keyframes pd{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
.hero h1{font-size:clamp(3rem,6.5vw,5.5rem);font-weight:800;letter-spacing:-.04em;line-height:1.02;color:#fff;margin-bottom:1.5rem;}
.hero h1 span{color:rgba(255,255,255,.65);}
.hero-sub{font-size:1.1rem;color:rgba(255,255,255,.72);line-height:1.7;max-width:520px;margin-bottom:2.5rem;font-weight:400;}
.hero-ctas{display:flex;gap:.875rem;flex-wrap:wrap;margin-bottom:3rem;}
.btn-wh{background:#fff;color:var(--blue);border:none;padding:.875rem 2rem;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:all .2s;box-shadow:0 4px 24px rgba(0,0,0,.15);}
.btn-wh:hover{transform:translateY(-2px);box-shadow:0 8px 36px rgba(0,0,0,.2);}
.btn-wh-out{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4);padding:.875rem 2rem;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:1rem;cursor:pointer;transition:all .2s;}
.btn-wh-out:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.7);}
.btn-hero-green{background:linear-gradient(120deg,#1aad5e,#25D366,#0e9e52,#22c55e);background-size:250% 100%;background-position:0% 50%;border:none;color:#fff;padding:.875rem 2rem;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 4px 24px rgba(37,211,102,.4);animation:greenShift 3s ease-in-out infinite;}
@keyframes greenShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.btn-hero-green:hover{transform:translateY(-2px);box-shadow:0 8px 36px rgba(37,211,102,.55);}
/* NAV SUPPORT BUTTON */
.btn-client{border:1.5px solid rgba(37,211,102,.6);background:rgba(37,211,102,.12);color:#16a34a;padding:.55rem 1.25rem;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.875rem;cursor:pointer;transition:all .2s;}
.btn-client:hover{background:rgba(37,211,102,.2);border-color:#16a34a;}
/* ECOSYSTEM SECTION */
.eco-sec{padding:90px 5%;background:#fff;border-bottom:1px solid var(--border);}
.eco-eyebrow{display:inline-flex;align-items:center;gap:6px;background:var(--blue-xl);border:1px solid rgba(51,51,229,.2);color:var(--blue);padding:.35rem 1rem;border-radius:100px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1.25rem;}
.eco-hd{font-size:clamp(2rem,3.5vw,2.8rem);font-weight:800;letter-spacing:-.04em;line-height:1.1;margin-bottom:.75rem;}
.eco-sub{font-size:1rem;color:var(--text-mu);line-height:1.7;max-width:600px;margin-bottom:3.5rem;}
.eco-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;}
.eco-card{border:1.5px solid var(--border);border-radius:20px;padding:1.75rem 1.5rem;transition:all .25s;cursor:default;background:#fff;}
.eco-card:hover{border-color:var(--blue);box-shadow:0 8px 32px rgba(51,51,229,.1);transform:translateY(-3px);}
.eco-card-icon{font-size:2rem;margin-bottom:1rem;}
.eco-card-tag{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin-bottom:.4rem;}
.eco-card-name{font-size:.975rem;font-weight:700;color:var(--text);line-height:1.3;}
.eco-center{text-align:center;margin-bottom:2.5rem;}
@media(max-width:900px){.eco-grid{grid-template-columns:repeat(2,1fr);}}
/* WA CHOICE MODAL */
.wa-choice-ov{position:fixed;inset:0;background:rgba(10,10,26,.5);backdrop-filter:blur(4px);z-index:900;display:flex;align-items:center;justify-content:center;padding:1rem;}
.wa-choice-box{background:#fff;border-radius:20px;padding:2rem;width:100%;max-width:420px;position:relative;box-shadow:0 40px 100px rgba(10,10,40,.25);}
.wa-choice-btn{width:100%;padding:1rem 1.25rem;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;font-weight:600;color:var(--text-m);cursor:pointer;display:flex;align-items:center;gap:.875rem;text-align:left;transition:all .2s;margin-bottom:.75rem;}
.wa-choice-btn:hover{border-color:var(--blue);background:var(--blue-xl);color:var(--blue);}
.wa-choice-btn:last-child{margin-bottom:0;}
.wa-choice-btn-icon{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;}
.hero-stats{display:flex;gap:2.5rem;}
.hero-stat-num{font-size:2rem;font-weight:800;letter-spacing:-.04em;color:#fff;}
.hero-stat-lbl{font-size:.78rem;color:rgba(255,255,255,.6);font-weight:500;margin-top:.2rem;}
.hero-right{grid-area:robot;display:flex;align-items:center;justify-content:center;align-self:center;position:relative;z-index:2;padding-top:1rem;}
.hero-robot{width:100%;max-width:520px;filter:drop-shadow(0 32px 60px rgba(0,0,0,.3));animation:float 4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}

/* TRUST */
.trust{padding:2rem 5%;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:2.5rem;flex-wrap:wrap;}
.trust-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-mu);font-weight:600;white-space:nowrap;}
.trust-div{width:1px;height:18px;background:var(--border);}
.trust-br{font-size:.95rem;font-weight:700;color:#C0C0D0;letter-spacing:-.01em;transition:color .2s;}
.trust-br:hover{color:var(--text-m);}

/* SOLUTIONS SECTION */
.sol-intro{padding:100px 5%;display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:center;border-bottom:1px solid var(--border);}
.sol-count-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.sol-count-item{background:#fff;padding:1rem 1.25rem;cursor:pointer;transition:background .15s;}
.sol-count-item:hover{background:var(--blue-xl);}
.sol-count-num{font-size:.65rem;font-weight:800;color:var(--blue);letter-spacing:.05em;margin-bottom:.3rem;}
.sol-count-name{font-size:.75rem;font-weight:600;color:var(--text-m);line-height:1.3;}

/* NUMBERED SOLUTION ROWS */
.sol-row{display:grid;grid-template-columns:1fr 1fr;min-height:580px;border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
.sol-row.rev{direction:rtl;}
.sol-row.rev > *{direction:ltr;}
.sol-row-text{padding:80px 6%;display:flex;flex-direction:column;justify-content:center;background:#fff;}
.sol-row.bg-alt .sol-row-text{background:var(--bg);}
.sol-num-big{font-size:7rem;font-weight:800;letter-spacing:-.06em;color:var(--blue-xl);line-height:1;margin-bottom:1.5rem;transition:color .4s;}
.sol-row:hover .sol-num-big{color:rgba(51,51,229,.12);}
.sol-cat{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:.75rem;}
.sol-title{font-size:clamp(1.7rem,2.5vw,2.3rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:1rem;}
.sol-desc{font-size:1rem;color:var(--text-m);line-height:1.7;margin-bottom:1.5rem;max-width:440px;}
.sol-ul{list-style:none;display:flex;flex-direction:column;gap:.55rem;margin-bottom:1.75rem;}
.sol-ul li{display:flex;align-items:flex-start;gap:.6rem;font-size:.9rem;color:var(--text-m);font-weight:500;}
.sol-ul li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:.48em;}
.sol-lnk{display:inline-flex;align-items:center;gap:.4rem;font-size:.875rem;font-weight:700;color:var(--blue);cursor:pointer;text-decoration:none;border-bottom:1.5px solid transparent;transition:border-color .2s;}
.sol-lnk:hover{border-bottom-color:var(--blue);}
.sol-row-img{
  overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:5%;
  background:#fff;
  background-image:
    linear-gradient(rgba(51,51,229,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(51,51,229,.055) 1px,transparent 1px);
  background-size:36px 36px;
}
.sol-row-img img{
  width:100%;height:auto;max-height:90%;
  object-fit:contain;
  border-radius:16px;
  box-shadow:0 8px 40px rgba(10,10,40,.12);
  transition:transform .6s ease, box-shadow .4s ease;
}
.sol-row:hover .sol-row-img img{transform:scale(1.02);box-shadow:0 16px 56px rgba(10,10,40,.18);}
.sol-row.bg-alt .sol-row-img{background:#f7f7fd;}
/* For robot */
.sol-row-img.robot-bg{background:#f7f7fd;display:flex;align-items:center;justify-content:center;padding:5%;}
.sol-row-img.robot-bg img{height:80%;width:auto;max-width:100%;object-fit:contain;border-radius:16px;box-shadow:0 8px 40px rgba(10,10,40,.12);}

/* HOW SECTION */
.how-sec{padding:100px 5%;background:var(--blue);text-align:center;}
.how-eyebrow{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.9);padding:.35rem 1rem;border-radius:100px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1.75rem;}
.how-sec h2{font-size:clamp(2rem,4vw,3.2rem);font-weight:800;letter-spacing:-.04em;color:#fff;margin-bottom:1rem;}
.how-sec .sub{font-size:1.05rem;color:rgba(255,255,255,.7);max-width:520px;margin:0 auto 4rem;line-height:1.7;}
.how-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;}
.how-card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:2.5rem;text-align:left;transition:background .2s;}
.how-card:hover{background:rgba(255,255,255,.16);}
.how-card-n{font-size:3rem;font-weight:800;letter-spacing:-.05em;color:rgba(255,255,255,.2);margin-bottom:1.5rem;}
.how-card h3{font-size:1.15rem;font-weight:700;color:#fff;margin-bottom:.5rem;letter-spacing:-.02em;}
.how-card p{font-size:.875rem;color:rgba(255,255,255,.65);line-height:1.65;}

/* CTA */
.cta-sec{padding:100px 5%;background:#fff;text-align:center;border-top:1px solid var(--border);}
.cta-inner{max-width:720px;margin:0 auto;}
.cta-eyebrow{display:inline-flex;align-items:center;gap:6px;background:var(--blue-xl);border:1px solid rgba(51,51,229,.2);color:var(--blue);padding:.35rem 1rem;border-radius:100px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1.75rem;}
.cta-sec h2{font-size:clamp(2.2rem,4vw,3.5rem);font-weight:800;letter-spacing:-.04em;margin-bottom:1rem;}
.cta-sec h2 em{font-style:normal;color:var(--blue);}
.cta-sec p{font-size:1.05rem;color:var(--text-mu);line-height:1.7;margin-bottom:2.5rem;}
.cta-form{display:flex;gap:.75rem;max-width:520px;margin:0 auto 2rem;flex-wrap:wrap;}
.cta-inp{flex:1;min-width:170px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);padding:.875rem 1.25rem;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s;}
.cta-inp:focus{border-color:var(--blue);}
.cta-inp::placeholder{color:var(--text-mu);}
.cta-trust{display:flex;gap:2rem;justify-content:center;flex-wrap:wrap;}
.cta-trust-item{display:flex;align-items:center;gap:.45rem;font-size:.82rem;color:var(--text-mu);font-weight:500;}
.cta-chk{width:18px;height:18px;border-radius:50%;background:var(--blue-xl);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* SUCCESS BOX */
.success-box{background:var(--blue-xl);border:1.5px solid rgba(51,51,229,.25);border-radius:16px;padding:2rem;max-width:400px;margin:0 auto 2rem;}
.success-box h3{font-size:1.15rem;font-weight:700;color:var(--text);margin-bottom:.4rem;}
.success-box p{font-size:.875rem;color:var(--text-mu);}

/* FOOTER */
footer{padding:2.5rem 5%;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);flex-wrap:wrap;gap:1rem;}
footer img{height:28px;border-radius:6px;}
.fc{font-size:.82rem;color:var(--text-mu);}


/* MODAL OVERLAY */
.modal-ov{position:fixed;inset:0;background:rgba(10,10,26,.7);backdrop-filter:blur(6px);z-index:900;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal-box{background:#fff;border-radius:20px;padding:2.5rem;width:100%;max-width:520px;position:relative;max-height:90vh;overflow-y:auto;box-shadow:0 40px 100px rgba(10,10,40,.25);}
.modal-close{position:absolute;top:1.25rem;right:1.25rem;background:var(--blue-xl);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-m);font-size:1rem;transition:background .2s;}
.modal-close:hover{background:var(--border);}
.modal-step{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:.5rem;}
.modal-q{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:1.5rem;line-height:1.3;}
.modal-opt{width:100%;text-align:left;padding:.9rem 1.25rem;border:1.5px solid var(--border);background:#fff;border-radius:10px;font-family:"Plus Jakarta Sans",sans-serif;font-size:.9rem;font-weight:500;color:var(--text-m);cursor:pointer;transition:all .15s;margin-bottom:.6rem;display:block;}
.modal-opt:hover{border-color:var(--blue);background:var(--blue-xl);color:var(--blue);}
.modal-opt.sel{border-color:var(--blue);background:var(--blue-xl);color:var(--blue);font-weight:700;}
.modal-inp{width:100%;border:1.5px solid var(--border);background:var(--bg);color:var(--text);padding:.875rem 1.25rem;border-radius:10px;font-family:"Plus Jakarta Sans",sans-serif;font-size:.95rem;outline:none;transition:border-color .2s;margin-bottom:1rem;}
.modal-inp:focus{border-color:var(--blue);}
.modal-inp::placeholder{color:var(--text-mu);}
.modal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;}
.modal-prog{display:flex;gap:5px;}
.modal-prog-dot{width:28px;height:4px;border-radius:2px;background:var(--border);transition:background .3s;}
.modal-prog-dot.on{background:var(--blue);}
.modal-disq{text-align:center;padding:1rem 0;}
.modal-disq-icon{font-size:2.5rem;margin-bottom:1rem;}
.modal-disq h3{font-size:1.2rem;font-weight:800;margin-bottom:.5rem;}
.modal-disq p{color:var(--text-mu);font-size:.9rem;line-height:1.6;}
.modal-ok{text-align:center;padding:1rem 0;}
.modal-ok-icon{width:64px;height:64px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:1.5rem;}
.modal-ok h3{font-size:1.2rem;font-weight:800;margin-bottom:.5rem;}
.modal-ok p{color:var(--text-mu);font-size:.9rem;line-height:1.6;margin-bottom:1.5rem;}

/* SUPPORT SECTION */
.sup-sec{padding:100px 5%;background:var(--blue);display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:center;}
.sup-eyebrow{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.9);padding:.35rem 1rem;border-radius:100px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1.75rem;}
.sup-sec h2{font-size:clamp(2rem,3.5vw,3rem);font-weight:800;letter-spacing:-.04em;color:#fff;line-height:1.1;margin-bottom:1rem;}
.sup-sec p{font-size:1.05rem;color:rgba(255,255,255,.7);line-height:1.7;margin-bottom:2rem;}
.sup-items{display:flex;flex-direction:column;gap:1.25rem;margin-bottom:2.5rem;}
.sup-item{display:flex;align-items:flex-start;gap:1rem;}
.sup-item-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.15);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.sup-item h4{font-size:.95rem;font-weight:700;color:#fff;margin-bottom:.2rem;}
.sup-item p{font-size:.83rem;color:rgba(255,255,255,.6);margin:0;}
.sup-img-wrap{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.3);}
.sup-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.sup-badge{position:absolute;bottom:1.5rem;left:1.5rem;background:#fff;border-radius:14px;padding:.875rem 1.25rem;display:flex;align-items:center;gap:.75rem;box-shadow:0 8px 30px rgba(0,0,0,.15);}
.sup-badge-icon{width:38px;height:38px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sup-badge h5{font-size:.875rem;font-weight:700;color:var(--text);margin:0;}
.sup-badge span{font-size:.75rem;color:var(--text-mu);font-weight:500;}
@media(max-width:900px){
  .sup-sec{grid-template-columns:1fr;gap:2.5rem;padding:60px 5%;}
  .modal-box{padding:1.75rem;}
}

/* DOTS NAV */
.dots{position:fixed;right:1.75rem;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);border:none;padding:0;cursor:pointer;transition:all .3s;}
.dot.on{background:var(--blue);transform:scale(1.5);}
.dot:hover{background:var(--blue-l);}

/* REVEAL */
.rv{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease;}
.rv-l{opacity:0;transform:translateX(-24px);transition:opacity .6s ease,transform .6s ease;}
.rv-r{opacity:0;transform:translateX(24px);transition:opacity .6s ease,transform .6s ease;}
.rv.in,.rv-l.in,.rv-r.in{opacity:1;transform:translate(0);}
.d1{transition-delay:.1s;}.d2{transition-delay:.2s;}.d3{transition-delay:.3s;}.d4{transition-delay:.35s;}

/* TWEAKS */
.tw-panel{position:fixed;bottom:1.5rem;right:1.5rem;z-index:500;background:#fff;border:1px solid var(--border);border-radius:16px;padding:1.5rem;width:240px;box-shadow:0 20px 60px rgba(10,10,26,.12);display:none;}
.tw-panel.on{display:block;}
.tw-panel h4{font-size:.875rem;font-weight:700;margin-bottom:1.25rem;}
.tw-label{font-size:.7rem;font-weight:600;color:var(--text-mu);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.05em;}
.tw-sel{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:.45rem;border-radius:7px;font-size:.8rem;outline:none;margin-bottom:.875rem;}
.tw-x{position:absolute;top:.875rem;right:.875rem;background:none;border:none;color:var(--text-mu);cursor:pointer;font-size:1rem;}

/* WHATSAPP FLOATING BUTTON */
.wa-fab{position:fixed;bottom:1.75rem;right:1.75rem;z-index:450;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.wa-ring{position:absolute;width:68px;height:68px;border-radius:50%;animation:wa-spin 2.5s linear infinite;}
@keyframes wa-spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
.wa-gap{position:absolute;width:60px;height:60px;border-radius:50%;background:#fff;}
.wa-inner{position:relative;width:52px;height:52px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(37,211,102,.4);transition:transform .2s,box-shadow .2s;}
.wa-fab:hover .wa-inner{transform:scale(1.1);box-shadow:0 6px 24px rgba(37,211,102,.55);}
.wa-inner svg{width:26px;height:26px;fill:#fff;}

@media(max-width:900px){
  .nav-links,.dots{display:none;}
  .sol-intro{grid-template-columns:1fr;gap:2rem;padding:60px 5%;}
  .sol-count-grid{grid-template-columns:repeat(2,1fr);}
  .sol-row{grid-template-columns:1fr;min-height:auto;}
  .sol-row.rev{direction:ltr;}
  .sol-row-img{height:auto;min-height:220px;padding:6%;}
  .sol-row-img img{width:100%;height:auto;max-height:none;border-radius:12px;}
  .sol-row-img.robot-bg{padding:8%;}
  .sol-row-img.robot-bg img{height:auto;width:100%;}
  .how-cards{grid-template-columns:1fr;}
  .hero{display:flex;flex-direction:column;gap:0;padding:80px 5% 48px;align-items:center;}
  .hero-head{order:1;text-align:center;width:100%;padding-bottom:0;}
  .hero-right{order:2;max-width:72%;width:100%;margin:1rem auto;}
  .hero-body{order:3;text-align:center;width:100%;}
  .hero-pill{margin-bottom:1rem;}
  .hero h1{font-size:clamp(2.2rem,9vw,3.2rem);margin-bottom:0;}
  .hero-sub{font-size:.95rem;margin-bottom:1.5rem;max-width:100%;}
  .hero-ctas{justify-content:center;gap:.625rem;margin-bottom:1.75rem;}
  .hero-stats{justify-content:center;gap:1.5rem;}
  .hero-stat-num{font-size:1.5rem;}
  .hero-robot{max-width:260px;}
  .cta-form{flex-direction:column;}
  .trust{gap:1.5rem;}

  /* UTILITY: responsive grids for inline-style sections */
  .mob-grid-1{grid-template-columns:1fr!important;gap:2.5rem!important;}
  .mob-grid-2{grid-template-columns:1fr 1fr!important;gap:1.25rem!important;}
  .mob-grid-footer{grid-template-columns:1fr 1fr!important;gap:2rem!important;}
  .mob-hide{display:none!important;}
  .mob-static{position:static!important;}
  .mob-pad{padding:60px 5%!important;}

  /* STATS section */
  #results-s{padding:60px 5%!important;}

  /* INTEGRATIONS section */
  .sec-integ{padding:60px 5%!important;}

  /* TESTIMONIAL section */
  .sec-test{padding:60px 5%!important;}

  /* FAQ section */
  .sec-faq{padding:60px 5%!important;}

  /* FOOTER */
  .sec-footer{padding:48px 5% 28px!important;}

  /* NAV buttons on mobile */
  .nav-r .btn-client{display:none;}
}

/* SPLIT FEATURE SECTION */
.split-sec{display:grid;grid-template-columns:1fr 1fr;min-height:580px;border-bottom:1px solid var(--border);}
.split-text{background:var(--blue);padding:80px 7%;display:flex;flex-direction:column;justify-content:center;}
.split-text h2{font-size:clamp(1.8rem,2.8vw,2.6rem);font-weight:800;letter-spacing:-.03em;color:#fff;line-height:1.15;margin-bottom:2rem;}
.split-items{display:flex;flex-direction:column;gap:1.75rem;margin-bottom:2.5rem;}
.split-item p{font-size:1rem;color:rgba(255,255,255,.78);line-height:1.7;padding-left:1.25rem;border-left:2px solid rgba(255,255,255,.3);}
.split-photo{position:relative;overflow:hidden;}
.split-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
@media(max-width:900px){.split-sec{grid-template-columns:1fr;}.split-photo{height:320px;}.split-text{padding:60px 5%;}}

</style>

      const dots=document.querySelectorAll('[data-dot]');
      let a=0;
      dots.forEach((d,i)=>{if(d.getBoundingClientRect().top<window.innerHeight*.6)a=i;});
      setActiveSection(a);

    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('scroll',onScroll);
  },[]);

            <div style={{width:52,height:52,borderRadius:'50%',background:'#25D366',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto .875rem'}}>
              <svg viewBox="0 0 24 24" fill="white" width="26" height="26"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.553 4.116 1.52 5.843L.057 23.143a.75.75 0 00.9.9l5.3-1.463A11.938 11.938 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.716 9.716 0 01-5.107-1.446l-.364-.217-3.135.865.843-3.138-.237-.374A9.75 9.75 0 012.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/></svg>
            </div>
            <div style={{fontSize:'1.15rem',fontWeight:800,letterSpacing:'-.02em',color:'var(--text)',marginBottom:'.3rem'}}>Como podemos te ajudar?</div>
            <p style={{fontSize:'.875rem',color:'var(--text-mu)'}}>Selecione a opção que melhor descreve você</p>
          </div>
          <button className="wa-choice-btn" onClick={()=>{setWaChoiceOpen(false);setModalOpen(true);}}>
            <div className="wa-choice-btn-icon" style={{background:'var(--blue-xl)'}}>🚀</div>
            <div>
              <div style={{fontWeight:700,color:'var(--text)',marginBottom:'.15rem'}}>Quero conhecer o JiMi Food</div>
              <div style={{fontSize:'.8rem',color:'var(--text-mu)',fontWeight:500}}>Ainda não sou cliente, quero saber mais</div>
            </div>
          </button>
          <button className="wa-choice-btn" onClick={()=>{setWaChoiceOpen(false);setSupportModalOpen(true);}}>
            <div className="wa-choice-btn-icon" style={{background:'rgba(37,211,102,.12)'}}>🛠️</div>
            <div>
              <div style={{fontWeight:700,color:'var(--text)',marginBottom:'.15rem'}}>Já sou Cliente / Suporte</div>
              <div style={{fontSize:'.8rem',color:'var(--text-mu)',fontWeight:500}}>Preciso de ajuda ou suporte técnico</div>
            </div>
          </button>
        </div>
      </div>
    )}

    {/* SUPPORT MODAL */}
    {supportModalOpen&&(
      <div className="modal-ov" onClick={e=>{if(e.target===e.currentTarget){setSupportModalOpen(false);setSupPhone('');setSupPhoneErr('');}}}>
        <div className="modal-box">
          <button className="modal-close" onClick={()=>{setSupportModalOpen(false);setSupPhone('');setSupPhoneErr('');}}>✕</button>
          <div style={{textAlign:'center',paddingBottom:'.5rem'}}>
            <div style={{fontSize:'2.5rem',marginBottom:'.75rem'}}>🛠️</div>
            <div className="modal-q" style={{marginBottom:'.25rem'}}>Suporte ao Cliente</div>
            <p style={{fontSize:'.875rem',color:'var(--text-mu)',lineHeight:1.6,marginBottom:'1.5rem'}}>Informe seu WhatsApp para que nossa equipe de suporte possa te atender com agilidade.</p>
          </div>
          <p style={{fontSize:'.82rem',color:'var(--text-mu)',marginBottom:'.5rem'}}>Formato: DDD + 9 + XXXX-XXXX</p>
          <input className="modal-inp" placeholder="Ex: 61 9 9999-9999" value={supPhone} onChange={e=>{setSupPhone(e.target.value);setSupPhoneErr('');}} type="tel"/>
          {supPhoneErr&&<p style={{color:'#e53e3e',fontSize:'.8rem',marginBottom:'.75rem',marginTop:'-.5rem'}}>{supPhoneErr}</p>}
          <button className="btn-bl" style={{width:'100%',padding:'.875rem',borderRadius:10,background:'#25D366',boxShadow:'0 4px 20px rgba(37,211,102,.3)'}} onClick={()=>{
            if(supPhone.replace(/\D/g,'').length<11){setSupPhoneErr('Informe um número válido: DDD + 9 + XXXX-XXXX');return;}
            const msg=encodeURIComponent("Olá! Sou cliente JiMi Food e preciso de suporte.\nMeu WhatsApp: "+supPhone);
            window.open("https://wa.me/5561996299003?text="+msg,"_blank");
            setSupportModalOpen(false);setSupPhone('');setSupPhoneErr('');
          }}>Falar com Suporte no WhatsApp →</button>
        </div>
      </div>
    )}

    {/* WHATSAPP FAB */}
    <div className="wa-fab" onClick={()=>setWaChoiceOpen(true)} title="Fale conosco pelo WhatsApp">
      <div className="wa-ring" style={{background:'conic-gradient(from 0deg,#25D366 0%,#128C7E 40%,transparent 60%,transparent 80%,#25D366 100%)'}}/>
      <div className="wa-gap"/>
      <div className="wa-inner">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.553 4.116 1.52 5.843L.057 23.143a.75.75 0 00.9.9l5.3-1.463A11.938 11.938 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.716 9.716 0 01-5.107-1.446l-.364-.217-3.135.865.843-3.138-.237-.374A9.75 9.75 0 012.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/></svg>
      </div>
    </div>

    {/* TWEAKS */}
    {twOn&&(
      <div className="tw-panel on">
        <button className="tw-x" onClick={()=>{setTwOn(false);window.parent.postMessage({type:'__edit_mode_dismissed'},'*');}}>✕</button>
        <h4>Tweaks</h4>
        <div className="tw-label">Variação de cor</div>
        <select className="tw-sel" value={tweaks.accent} onChange={e=>{setTweak('accent',e.target.value);const r=document.documentElement;if(e.target.value==='blue')r.style.setProperty('--blue','#3333E5');else if(e.target.value==='indigo')r.style.setProperty('--blue','#4F46E5');else r.style.setProperty('--blue','#2020C0');}}>
          <option value="blue">Azul JiMi (padrão)</option>
          <option value="indigo">Índigo</option>
          <option value="navy">Azul Marinho</option>
        </select>
      </div>
    )}
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
